<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Temps Réel — Test</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: #f0f2f5; height: 100vh; display: flex; justify-content: center; align-items: center; }
.container { display: flex; gap: 16px; width: 1000px; height: 700px; }

/* Auth Panel */
.auth-panel { width: 300px; background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.1); display: flex; flex-direction: column; gap: 16px; }
.auth-panel h2 { font-size: 18px; color: #1a1a2e; }
.auth-panel input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
.auth-panel input:focus { outline: none; border-color: #4f46e5; }
.auth-panel button { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
.btn-primary { background: #4f46e5; color: white; }
.btn-primary:hover { background: #4338ca; }
.btn-secondary { background: #e5e7eb; color: #374151; }
.btn-secondary:hover { background: #d1d5db; }
.btn-danger { background: #ef4444; color: white; }
.btn-danger:hover { background: #dc2626; }
.auth-panel .error { color: #ef4444; font-size: 13px; display: none; }
.auth-panel .success { color: #22c55e; font-size: 13px; display: none; }
.auth-row { display: flex; gap: 8px; }
.auth-row button { flex: 1; }
.token-box { font-size: 11px; word-break: break-all; background: #f9fafb; padding: 8px; border-radius: 6px; border: 1px solid #e5e7eb; max-height: 60px; overflow-y: auto; display: none; }

/* Chat Panel */
.chat-panel { flex: 1; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.1); display: flex; flex-direction: column; overflow: hidden; }
.header { background: #4f46e5; color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 18px; }
.header span { font-size: 13px; opacity: .9; }

/* Rooms bar */
.rooms-bar { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap; }
.room-tab { padding: 6px 14px; border-radius: 20px; border: 1px solid #ddd; background: white; cursor: pointer; font-size: 13px; transition: all .2s; }
.room-tab:hover { border-color: #4f46e5; color: #4f46e5; }
.room-tab.active { background: #4f46e5; color: white; border-color: #4f46e5; }

/* Messages */
.messages { flex: 1; padding: 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.msg { padding: 10px 14px; border-radius: 10px; max-width: 75%; font-size: 14px; line-height: 1.4; }
.msg.me { align-self: flex-end; background: #4f46e5; color: white; border-bottom-right-radius: 4px; }
.msg.other { align-self: flex-start; background: #f3f4f6; border-bottom-left-radius: 4px; }
.msg.system { align-self: center; background: #fef3c7; color: #92400e; font-size: 12px; border-radius: 12px; padding: 4px 16px; }
.msg .sender { font-size: 11px; font-weight: 600; margin-bottom: 2px; }
.msg.me .sender { color: #c7d2fe; }
.msg.other .sender { color: #4f46e5; }
.msg .time { font-size: 10px; opacity: .6; margin-top: 4px; text-align: right; }
.msg.deleted { opacity: .5; font-style: italic; }
.empty-chat { flex: 1; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 14px; }

/* Input */
.input-bar { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid #e5e7eb; }
.input-bar input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 24px; font-size: 14px; outline: none; }
.input-bar input:focus { border-color: #4f46e5; }
.input-bar button { padding: 10px 20px; border: none; border-radius: 24px; background: #4f46e5; color: white; font-size: 14px; cursor: pointer; font-weight: 600; }
.input-bar button:hover { background: #4338ca; }
.input-bar button:disabled { background: #d1d5db; cursor: not-allowed; }

/* MP modal */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.4); z-index: 100; justify-content: center; align-items: center; }
.modal-overlay.show { display: flex; }
.modal { background: white; border-radius: 12px; padding: 24px; width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,.2); }
.modal h3 { margin-bottom: 16px; }
.modal input, .modal select { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.connected-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.connected-dot.on { background: #22c55e; }
.connected-dot.off { background: #ef4444; }
</style>
</head>
<body>

<div class="container">
  <!-- Auth Panel -->
  <div class="auth-panel">
    <h2>Authentification</h2>

    <div class="auth-row">
      <button class="btn-primary" onclick="showTab('login')">Connexion</button>
      <button class="btn-secondary" onclick="showTab('register')">Inscription</button>
    </div>

    <div id="login-form">
      <input type="text" id="login-username" placeholder="Nom d'utilisateur" autocomplete="off">
      <input type="password" id="login-password" placeholder="Mot de passe">
      <button class="btn-primary" onclick="login()">Se connecter</button>
    </div>

    <div id="register-form" style="display:none">
      <input type="text" id="reg-username" placeholder="Nom d'utilisateur" autocomplete="off">
      <input type="password" id="reg-password" placeholder="Mot de passe (min 6 car.)">
      <button class="btn-primary" onclick="register()">S'inscrire</button>
    </div>

    <div class="error" id="auth-error"></div>
    <div class="success" id="auth-success"></div>

    <div class="token-box" id="token-box"></div>

    <hr>
    <button class="btn-secondary" onclick="createRoom()">➕ Nouveau salon</button>
    <button class="btn-secondary" onclick="showMP()">✉️ Message privé</button>
    <button class="btn-danger" onclick="disconnect()" id="btn-disconnect" style="display:none">Déconnexion</button>
  </div>

  <!-- Chat Panel -->
  <div class="chat-panel">
    <div class="header">
      <div>
        <h1>Chat Temps Réel</h1>
        <span id="connection-status"><span class="connected-dot off"></span>Déconnecté</span>
      </div>
      <span id="user-display"></span>
    </div>

    <div class="rooms-bar" id="rooms-bar">
      <span style="color:#9ca3af;font-size:13px">Connectez-vous pour voir les salons...</span>
    </div>

    <div class="messages" id="messages">
      <div class="empty-chat">Connectez-vous et rejoignez un salon pour chatter</div>
    </div>

    <div class="input-bar">
      <input type="text" id="msg-input" placeholder="Écrire un message..." disabled
             onkeydown="if(event.key==='Enter') sendMessage()">
      <button id="send-btn" onclick="sendMessage()" disabled>Envoyer</button>
    </div>
  </div>
</div>

<!-- MP Modal -->
<div class="modal-overlay" id="mp-modal">
  <div class="modal">
    <h3>Message privé</h3>
    <select id="mp-user"></select>
    <input type="text" id="mp-content" placeholder="Votre message...">
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeMP()">Annuler</button>
      <button class="btn-primary" onclick="sendMP()">Envoyer</button>
    </div>
  </div>
</div>

<!-- Room Creation Modal -->
<div class="modal-overlay" id="room-modal">
  <div class="modal">
    <h3>Nouveau salon</h3>
    <input type="text" id="room-name" placeholder="Nom du salon">
    <input type="text" id="room-desc" placeholder="Description (optionnelle)">
    <select id="room-type">
      <option value="public">Public</option>
      <option value="private">Privé</option>
      <option value="readonly">Lecture seule</option>
    </select>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeRoomModal()">Annuler</button>
      <button class="btn-primary" onclick="createRoomSubmit()">Créer</button>
    </div>
  </div>
</div>

<script>
// ============ STATE ============
let token = null;
let currentUser = null;
let ws = null;
let currentRoomId = null;
let wsConnected = false;
let roomTabs = {};

const API = "http://localhost:8000/v1";

// ============ AUTH UI ============
function showTab(tab) {
  document.getElementById('login-form').style.display = tab === 'login' ? '' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? '' : 'none';
  clearAuthMsg();
}

function clearAuthMsg() {
  document.getElementById('auth-error').style.display = 'none';
  document.getElementById('auth-success').style.display = 'none';
}

function showError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('auth-success').style.display = 'none';
}

function showSuccess(msg) {
  const el = document.getElementById('auth-success');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('auth-error').style.display = 'none';
}

// ============ AUTH API ============
async function register() {
  clearAuthMsg();
  const username = document.getElementById('reg-username').value.trim();
  const password = document.getElementById('reg-password').value;
  if (!username || !password) return showError('Remplissez tous les champs');

  try {
    const r = await fetch(`${API}/auth/register`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await r.json();
    if (!r.ok) return showError(data.detail || 'Erreur');
    token = data.access_token;
    currentUser = data.user;
    onAuthSuccess('Inscription réussie!');
  } catch(e) { showError('Erreur réseau'); }
}

async function login() {
  clearAuthMsg();
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  if (!username || !password) return showError('Remplissez tous les champs');

  try {
    const r = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
    });
    const data = await r.json();
    if (!r.ok) return showError(data.detail || 'Erreur');
    token = data.access_token;
    currentUser = data.user;
    onAuthSuccess('Connexion réussie!');
  } catch(e) { showError('Erreur réseau'); }
}

function onAuthSuccess(msg) {
  showSuccess(msg);
  document.getElementById('token-box').textContent = `Token: ${token.substring(0,50)}...`;
  document.getElementById('token-box').style.display = 'block';
  document.getElementById('user-display').textContent = `👤 ${currentUser.username}`;
  document.getElementById('btn-disconnect').style.display = '';
  loadRooms();
  connectWS();
}

function disconnect() {
  if (ws) ws.close();
  token = null; currentUser = null; ws = null; currentRoomId = null;
  wsConnected = false;
  document.getElementById('token-box').style.display = 'none';
  document.getElementById('user-display').textContent = '';
  document.getElementById('btn-disconnect').style.display = 'none';
  document.getElementById('rooms-bar').innerHTML = '<span style="color:#9ca3af;font-size:13px">Connectez-vous pour voir les salons...</span>';
  document.getElementById('messages').innerHTML = '<div class="empty-chat">Connectez-vous et rejoignez un salon pour chatter</div>';
  document.getElementById('msg-input').disabled = true;
  document.getElementById('send-btn').disabled = true;
  updateConnStatus(false);
  showSuccess('Déconnecté');
}

// ============ WEBSOCKET ============
function connectWS() {
  if (ws) ws.close();
  updateConnStatus(false);

  ws = new WebSocket(`ws://localhost:8000/ws?token=${token}`);

  ws.onopen = () => {
    wsConnected = true;
    updateConnStatus(true);
    addSystemMsg('Connecté au chat temps réel');
  };

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    handleWSEvent(data);
  };

  ws.onclose = () => {
    wsConnected = false;
    updateConnStatus(false);
    if (token) {
      addSystemMsg('⚠️ Connexion perdue. Reconnexion dans 3s...');
      setTimeout(connectWS, 3000);
    }
  };

  ws.onerror = () => { ws.close(); };
}

function updateConnStatus(connected) {
  const el = document.getElementById('connection-status');
  el.innerHTML = connected
    ? '<span class="connected-dot on"></span>Connecté'
    : '<span class="connected-dot off"></span>Déconnecté';
}

function handleWSEvent(data) {
  switch (data.event) {
    case 'connected':
      break;
    case 'message':
      if (data.room_id == currentRoomId) {
        addMessage(data.sender_username, data.content, data.sender_id === currentUser.id, data.created_at);
      }
      break;
    case 'private_message':
      const from = data.sender_id === currentUser.id ? `Moi → ${data.receiver_username}` : `📩 ${data.sender_username} (privé)`;
      addSystemMsg(`${from}: ${data.content}`);
      break;
    case 'user_joined':
      if (data.room_id == currentRoomId) addSystemMsg(`👋 ${data.username} a rejoint le salon`);
      break;
    case 'user_left':
      if (data.room_id == currentRoomId) addSystemMsg(`🚪 ${data.username} a quitté le salon`);
      break;
    case 'error':
      addSystemMsg(`❌ ${data.message}`);
      break;
  }
}

// ============ ROOMS ============
async function loadRooms() {
  try {
    const r = await fetch(`${API}/rooms/`, {headers: {'Authorization': `Bearer ${token}`}});
    const rooms = await r.json();
    const bar = document.getElementById('rooms-bar');
    bar.innerHTML = '';

    if (rooms.length === 0) {
      bar.innerHTML = '<span style="color:#9ca3af;font-size:13px">Aucun salon disponible</span>';
      return;
    }

    rooms.forEach(room => {
      const tab = document.createElement('button');
      tab.className = 'room-tab';
      const icon = room.room_type === 'private' ? '🔒' : room.room_type === 'readonly' ? '📖' : '🌐';
      tab.textContent = `${icon} ${room.name} (${room.member_count})`;
      tab.onclick = () => joinRoom(room.id, room.name);
      if (room.id === currentRoomId) tab.classList.add('active');
      bar.appendChild(tab);
      roomTabs[room.id] = tab;
    });
  } catch(e) { addSystemMsg('❌ Erreur chargement salons'); }
}

async function joinRoom(roomId, roomName) {
  currentRoomId = roomId;
  document.getElementById('messages').innerHTML = '';
  document.getElementById('msg-input').disabled = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('msg-input').placeholder = `Message dans #${roomName}...`;

  // UI: active tab
  Object.values(roomTabs).forEach(t => t.classList.remove('active'));
  if (roomTabs[roomId]) roomTabs[roomId].classList.add('active');

  // Join via REST + WS
  try {
    await fetch(`${API}/rooms/${roomId}/join`, {method: 'POST', headers: {'Authorization': `Bearer ${token}`}});
  } catch(e) {}

  if (ws && wsConnected) {
    ws.send(JSON.stringify({event: "join_room", room_id: roomId}));
  }

  // Load history
  loadHistory(roomId);
}

async function loadHistory(roomId) {
  try {
    const r = await fetch(`${API}/rooms/${roomId}/messages`, {headers: {'Authorization': `Bearer ${token}`}});
    const msgs = await r.json();
    document.getElementById('messages').innerHTML = '';
    if (msgs.length === 0) {
      document.getElementById('messages').innerHTML = '<div class="empty-chat">Aucun message dans ce salon</div>';
      return;
    }
    msgs.reverse().forEach(m => {
      addMessage(m.sender?.username || 'Inconnu',
                 m.is_deleted ? 'Ce message a été supprimé' : m.content,
                 m.sender_id === currentUser.id,
                 m.created_at,
                 m.is_deleted);
    });
  } catch(e) { addSystemMsg('❌ Erreur chargement historique'); }
}

// ============ MESSAGES ============
function sendMessage() {
  const input = document.getElementById('msg-input');
  const content = input.value.trim();
  if (!content || !currentRoomId || !ws || !wsConnected) return;

  ws.send(JSON.stringify({event: "message", room_id: currentRoomId, content}));
  input.value = '';
}

function addMessage(sender, content, isMe, time, isDeleted) {
  const el = document.getElementById('messages');
  const empty = el.querySelector('.empty-chat');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = `msg ${isMe ? 'me' : 'other'}${isDeleted ? ' deleted' : ''}`;
  div.innerHTML = `
    <div class="sender">${isMe ? 'Moi' : sender}</div>
    <div>${escapeHtml(content)}</div>
    <div class="time">${time ? new Date(time).toLocaleTimeString() : ''}</div>
  `;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function addSystemMsg(text) {
  const el = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg system';
  div.textContent = text;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

// ============ MODALS ============
function createRoom() {
  document.getElementById('room-modal').classList.add('show');
  document.getElementById('room-name').value = '';
  document.getElementById('room-desc').value = '';
  document.getElementById('room-type').value = 'public';
}

function closeRoomModal() {
  document.getElementById('room-modal').classList.remove('show');
}

async function createRoomSubmit() {
  const name = document.getElementById('room-name').value.trim();
  const description = document.getElementById('room-desc').value.trim();
  const room_type = document.getElementById('room-type').value;
  if (!name) return;

  try {
    const r = await fetch(`${API}/rooms/`, {
      method: 'POST',
      headers: {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'},
      body: JSON.stringify({name, description, room_type})
    });
    if (r.ok) {
      closeRoomModal();
      addSystemMsg(`✅ Salon "${name}" créé`);
      loadRooms();
    } else {
      const data = await r.json();
      addSystemMsg(`❌ ${data.detail}`);
    }
  } catch(e) { addSystemMsg('❌ Erreur création salon'); }
}

function showMP() {
  if (!token) return showError('Connectez-vous d\'abord');
  const sel = document.getElementById('mp-user');
  sel.innerHTML = '<option value="">Chargement...</option>';
  document.getElementById('mp-content').value = '';
  document.getElementById('mp-modal').classList.add('show');

  fetch(`${API}/users/`, {headers: {'Authorization': `Bearer ${token}`}})
    .then(r => r.json())
    .then(users => {
      sel.innerHTML = '';
      users.forEach(u => {
        if (u.id !== currentUser.id) {
          const opt = document.createElement('option');
          opt.value = u.id;
          opt.textContent = `${u.username}${u.is_active ? '' : ' (suspendu)'}`;
          opt.disabled = !u.is_active;
          sel.appendChild(opt);
        }
      });
    });
}

function closeMP() { document.getElementById('mp-modal').classList.remove('show'); }

async function sendMP() {
  const receiver_id = parseInt(document.getElementById('mp-user').value);
  const content = document.getElementById('mp-content').value.trim();
  if (!receiver_id || !content) return;

  if (ws && wsConnected) {
    ws.send(JSON.stringify({event: "private_message", receiver_id, content}));
    addSystemMsg(`Moi → ${document.getElementById('mp-user').selectedOptions[0].text}: ${content}`);
  }
  closeMP();
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>
</body>
</html>
